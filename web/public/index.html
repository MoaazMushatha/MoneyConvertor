<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -2px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select,
    input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.2s;
      appearance: none;
    }

    select:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .swap-btn {
      display: flex;
      justify-content: center;
      margin: 0.5rem 0;
    }

    .swap-btn button {
      background: none;
      border: 2px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--primary);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .swap-btn button:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .convert-btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .convert-btn:hover {
      background: var(--primary-hover);
    }

    .convert-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: linear-gradient(135deg, #eff6ff, #f0fdf4);
      border-radius: 0.75rem;
      text-align: center;
      display: none;
    }

    .result.visible {
      display: block;
    }

    .result-amount {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--success);
    }

    .result-details {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .error {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fef2f2;
      color: var(--error);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      display: none;
    }

    .error.visible {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    footer {
      margin-top: 2rem;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Currency Converter</h1>
  <p class="subtitle">Real-time exchange rates powered by Hono</p>

  <div class="card">
    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="1" min="0" step="any" />
    </div>

    <div class="form-group">
      <label for="fromCurrency">From</label>
      <select id="fromCurrency">
        <option value="">Loading currencies...</option>
      </select>
    </div>

    <div class="swap-btn">
      <button id="swapBtn" title="Swap currencies">&#8645;</button>
    </div>

    <div class="form-group">
      <label for="toCurrency">To</label>
      <select id="toCurrency">
        <option value="">Loading currencies...</option>
      </select>
    </div>

    <button class="convert-btn" id="convertBtn" disabled>Convert</button>

    <div class="result" id="result">
      <div class="result-amount" id="resultAmount"></div>
      <div class="result-details" id="resultDetails"></div>
    </div>

    <div class="error" id="error"></div>
  </div>

  <footer>
    Rates from <a href="https://open.er-api.com" target="_blank">open.er-api.com</a>
  </footer>

  <script>
    const API_BASE = "/api";

    const fromSelect = document.getElementById("fromCurrency");
    const toSelect = document.getElementById("toCurrency");
    const amountInput = document.getElementById("amount");
    const convertBtn = document.getElementById("convertBtn");
    const swapBtn = document.getElementById("swapBtn");
    const resultDiv = document.getElementById("result");
    const resultAmount = document.getElementById("resultAmount");
    const resultDetails = document.getElementById("resultDetails");
    const errorDiv = document.getElementById("error");

    const POPULAR = ["USD", "EUR", "GBP", "JPY", "CAD", "AUD", "CHF", "CNY", "INR", "BRL"];

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.classList.add("visible");
      resultDiv.classList.remove("visible");
    }

    function hideError() {
      errorDiv.classList.remove("visible");
    }

    function populateSelect(select, currencies, defaultVal) {
      select.innerHTML = "";

      const popularGroup = document.createElement("optgroup");
      popularGroup.label = "Popular";
      const otherGroup = document.createElement("optgroup");
      otherGroup.label = "All Currencies";

      currencies.forEach((code) => {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = code;
        if (code === defaultVal) option.selected = true;

        if (POPULAR.includes(code)) {
          popularGroup.appendChild(option);
        } else {
          otherGroup.appendChild(option);
        }
      });

      select.appendChild(popularGroup);
      select.appendChild(otherGroup);
    }

    async function loadCurrencies() {
      try {
        const res = await fetch(`${API_BASE}/currencies`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        populateSelect(fromSelect, data.currencies, "USD");
        populateSelect(toSelect, data.currencies, "EUR");
        convertBtn.disabled = false;
      } catch (err) {
        showError("Failed to load currencies. Please refresh the page.");
      }
    }

    async function convert() {
      hideError();
      const from = fromSelect.value;
      const to = toSelect.value;
      const amount = amountInput.value;

      if (!from || !to || !amount) {
        showError("Please fill in all fields.");
        return;
      }

      convertBtn.disabled = true;
      convertBtn.innerHTML = '<span class="loading"></span>';

      try {
        const res = await fetch(
          `${API_BASE}/convert?from=${from}&to=${to}&amount=${amount}`
        );
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        resultAmount.textContent = `${data.converted.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })} ${data.to}`;
        resultDetails.textContent = `1 ${data.from} = ${data.rate} ${data.to} · Updated ${data.lastUpdated}`;
        resultDiv.classList.add("visible");
      } catch (err) {
        showError(err.message || "Conversion failed. Please try again.");
      } finally {
        convertBtn.disabled = false;
        convertBtn.textContent = "Convert";
      }
    }

    swapBtn.addEventListener("click", () => {
      const temp = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = temp;
    });

    convertBtn.addEventListener("click", convert);

    amountInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") convert();
    });

    loadCurrencies();
  </script>
</body>
</html>
